<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Paribesh Bandhu · Jury Portal</title>
  <meta name="description" content="Paribesh Bandhu jury submissions — details, photographs and documents.">
  <meta name="theme-color" content="#4b5f2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Paribesh Jury">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar vv-pin" id="topbar" hidden>
    <div class="brand">
      <img src="icons/icon-192.png" alt="" width="36" height="36">
      <div>
        <div class="brand-name" id="brandName">Paribesh Bandhu</div>
        <div class="brand-sub" id="brandSub">Jury Portal</div>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="who" id="who"></span>
      <button class="btn-icon" id="menuBtn" aria-label="Menu" aria-haspopup="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="menu" id="menu" hidden>
        <button data-act="switch" id="switchBtn" hidden>My committee forms</button>
        <button data-act="profile">My profile</button>
        <button data-act="logout">Log out</button>
      </div>
    </div>
  </header>
  <div id="topbarSpacer" aria-hidden="true"></div>

  <div class="demo-banner" id="demoBanner" hidden>
    Demo mode — data is stored only in this browser. Try <b>9800000000</b> or <b>9811111111</b> (jury) or <b>9822222222</b> (admin).
  </div>

  <main id="app" class="container" aria-live="polite"></main>

  <div class="install-tip" id="installTip" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="overlay vv-pin vv-full" id="overlay" hidden><div class="spinner"></div><div id="overlayMsg">Please wait…</div></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
